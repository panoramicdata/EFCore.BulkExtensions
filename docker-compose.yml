version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: efcore-bulk-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=EFCoreBulk123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P EFCoreBulk123! -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: efcore-bulk-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=EFCoreBulk123!
      - POSTGRES_DB=EFCoreBulkTests
    ports:
      - "5435:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: efcore-bulk-postgres-gis
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=EFCoreBulk123!
      - POSTGRES_DB=EFCoreBulkTests
    ports:
      - "5436:5432"
    volumes:
      - postgres-gis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  sqlserver-data:
  postgres-data:
  postgres-gis-data:
